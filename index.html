```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NurseFlow 🩺</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
      background: #f7fbfc;
      color: #243b43;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e8f0f2;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 800;
      color: #168b91;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: #dff7f5;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f8dfe9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* ================= MAIN ================= */

    main {
      width: min(1200px, 90%);
      margin: 35px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #789097;
    }

    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid #e8f0f2;
      transition: 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(30, 100, 110, 0.08);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .teal {
      background: #dff7f5;
    }

    .pink {
      background: #fbe4ed;
    }

    .yellow {
      background: #fff4d7;
    }

    .blue {
      background: #e3f0ff;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
    }

    .stat-label {
      color: #84979d;
      font-size: 14px;
    }

    /* ================= GRID ================= */

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 22px;
    }

    .section {
      background: white;
      border: 1px solid #e8f0f2;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title h2 {
      font-size: 19px;
    }

    .see-all {
      color: #168b91;
      font-size: 13px;
      font-weight: 700;
      border: none;
      background: none;
    }

    /* ================= PATIENTS ================= */

    .patient {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #edf2f3;
    }

    .patient:last-child {
      border-bottom: none;
    }

    .patient-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .
